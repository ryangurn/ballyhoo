name: source-vancouver-farmers-market

# One request against The Events Calendar's REST route on a small nonprofit's
# WordPress site. The season and its music lineup are published months out, so four
# runs a day is generous.
#
# Watch without_venue_coordinates in the run log. Non-zero means upstream has started
# using a venue that is not in venues.json, and those events are publishing unpinned.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: source-vancouver-farmers-market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      - uses: actions/checkout@v4
        with:
          ref: archive
          path: .archive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        working-directory: pipeline
        run: uv sync --frozen

      - name: Fetch, normalize, publish
        working-directory: pipeline
        run: |
          set -o pipefail
          uv run python -m pipeline.sources.vancouver_farmers_market \
            --pages-dir "$GITHUB_WORKSPACE/.gh-pages" \
            --archive-dir "$GITHUB_WORKSPACE/.archive" \
            --output "$GITHUB_WORKSPACE/dist/vancouver-farmers-market.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee "$GITHUB_WORKSPACE/run.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Vancouver Farmers Market"
            echo ""
            echo "Mode: ${{ inputs.dry_run && 'dry run' || 'publish' }}"
            echo ""
            echo '```'
            tail -n 30 run.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vancouver-farmers-market-feed
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
