name: source-neighborhood-markets

# One request per market website, about twenty in all, each on a different small
# operator's host. Nothing here is a calendar: every market day is expanded from a
# schedule encoded in markets.py, and the pages are read only to confirm the sentences
# those schedules came from are still there. Four runs a day keeps the window rolling.
#
# Watch markets_statement_changed in the run log. Non-zero means a market's website no
# longer says what its entry in markets.py was encoded from — usually next season's
# dates going up — and that market is withheld until someone re-reads the page. The
# warning line names the market and the page.

on:
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: source-neighborhood-markets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      - uses: actions/checkout@v4
        with:
          ref: archive
          path: .archive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        working-directory: pipeline
        run: uv sync --frozen

      - name: Fetch, normalize, publish
        working-directory: pipeline
        run: |
          set -o pipefail
          uv run python -m pipeline.sources.neighborhood_markets \
            --pages-dir "$GITHUB_WORKSPACE/.gh-pages" \
            --archive-dir "$GITHUB_WORKSPACE/.archive" \
            --output "$GITHUB_WORKSPACE/dist/neighborhood-markets.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee "$GITHUB_WORKSPACE/run.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Neighborhood farmers markets"
            echo ""
            echo "Mode: ${{ inputs.dry_run && 'dry run' || 'publish' }}"
            echo ""
            echo '```'
            tail -n 30 run.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-markets-feed
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
