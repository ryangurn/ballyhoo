name: source-pdxparent-markets

# One request for one page. Everything else is expansion of recurrence rules parsed
# out of that page, and a listicle is edited a few times a season, so four runs a day
# is already far more often than the content changes.
#
# Watch dropped_unparseable_schedule in the run log. It is 0 today; a jump means the
# roundup has been reworded into a form the parser does not read, and those markets
# are being withheld rather than guessed at.

on:
  schedule:
    - cron: "55 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: source-pdxparent-markets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      - uses: actions/checkout@v4
        with:
          ref: archive
          path: .archive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        working-directory: pipeline
        run: uv sync --frozen

      - name: Fetch, normalize, publish
        working-directory: pipeline
        run: |
          set -o pipefail
          uv run python -m pipeline.sources.pdxparent_markets \
            --pages-dir "$GITHUB_WORKSPACE/.gh-pages" \
            --archive-dir "$GITHUB_WORKSPACE/.archive" \
            --output "$GITHUB_WORKSPACE/dist/pdxparent-markets.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee "$GITHUB_WORKSPACE/run.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## PDX Parent markets"
            echo ""
            echo "Mode: ${{ inputs.dry_run && 'dry run' || 'publish' }}"
            echo ""
            echo '```'
            tail -n 30 run.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdxparent-markets-feed
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
