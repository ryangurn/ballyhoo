name: source-hillsboro-farmers-markets

# One request for one Squarespace events page covering all four Hillsboro markets.
# Market days are posted a season at a time, so four runs a day mostly catches
# cancellations.
#
# Watch dropped_unrecognised_title in the run log. Non-zero means the operator has
# titled an item in a way none of the markets in config match, most likely a fifth
# market, and its days are not publishing.

on:
  schedule:
    - cron: "12 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: source-hillsboro-farmers-markets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      - uses: actions/checkout@v4
        with:
          ref: archive
          path: .archive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        working-directory: pipeline
        run: uv sync --frozen

      - name: Fetch, normalize, publish
        working-directory: pipeline
        run: |
          set -o pipefail
          uv run python -m pipeline.sources.hillsboro_farmers_markets \
            --pages-dir "$GITHUB_WORKSPACE/.gh-pages" \
            --archive-dir "$GITHUB_WORKSPACE/.archive" \
            --output "$GITHUB_WORKSPACE/dist/hillsboro-farmers-markets.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee "$GITHUB_WORKSPACE/run.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Hillsboro Farmers' Markets"
            echo ""
            echo "Mode: ${{ inputs.dry_run && 'dry run' || 'publish' }}"
            echo ""
            echo '```'
            tail -n 30 run.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hillsboro-farmers-markets-feed
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
